# OpenCTI on the Vision One protected EKS cluster (chart: devops-ia/helm-opencti).
# Platform and worker image repository/tag are injected by the deploy workflow from ECR.
# All credentials come from the Kubernetes secret "opencti-credentials", generated by the
# deploy workflow on first run; nothing sensitive lives in this file.

fullnameOverride: opencti
replicaCount: 1

strategy:
  type: Recreate

image:
  pullPolicy: IfNotPresent

env:
  APP__ADMIN__EMAIL: admin@opencti.local
  APP__BASE_PATH: "/"
  APP__TELEMETRY__METRICS__ENABLED: true
  APP__GRAPHQL__PLAYGROUND__ENABLED: false
  APP__GRAPHQL__PLAYGROUND__FORCE_DISABLED_INTROSPECTION: true

  ELASTICSEARCH__ENGINE_SELECTOR: opensearch
  ELASTICSEARCH__URL: http://opencti-opensearch:9200

  MINIO__ENDPOINT: opencti-rustfs-svc

  RABBITMQ__HOSTNAME: opencti-rabbitmq
  RABBITMQ__PORT: 5672
  RABBITMQ__PORT_MANAGEMENT: 15672
  RABBITMQ__USERNAME: user

  REDIS__HOSTNAME: opencti-redis
  REDIS__MODE: single
  REDIS__PORT: 6379

envFromSecrets:
  APP__ADMIN__PASSWORD:
    name: opencti-credentials
    key: APP__ADMIN__PASSWORD
  APP__ADMIN__TOKEN:
    name: opencti-credentials
    key: APP__ADMIN__TOKEN
  APP__HEALTH_ACCESS_KEY:
    name: opencti-credentials
    key: APP__HEALTH_ACCESS_KEY
  APP__ENCRYPTION_KEY:
    name: opencti-credentials
    key: APP__ENCRYPTION_KEY
  MINIO__ACCESS_KEY:
    name: opencti-credentials
    key: RUSTFS_ACCESS_KEY
  MINIO__SECRET_KEY:
    name: opencti-credentials
    key: RUSTFS_SECRET_KEY
  RABBITMQ__PASSWORD:
    name: opencti-credentials
    key: rabbitmq-password

readyChecker:
  enabled: true
  retries: 60
  timeout: 5
  services:
    - name: opensearch
      port: 9200
    - name: rustfs
      address: opencti-rustfs-svc
      port: 9000
    - name: rabbitmq
      port: 5672
    - name: redis
      port: 6379

# First boot creates the search indices; allow up to 10 minutes before restarting.
startupProbe:
  enabled: true
  failureThreshold: 60
  periodSeconds: 10
  timeoutSeconds: 5

lifecycle:
  preStop:
    exec:
      command: ["sh", "-c", "sleep 5"]

terminationGracePeriodSeconds: 20

# TLS terminates on the AWS load balancer; the certificate ARN (IAM or ACM) is supplied per
# environment through the annotation service.beta.kubernetes.io/aws-load-balancer-ssl-cert.
service:
  type: LoadBalancer
  port: 443
  targetPort: 4000
  protocol: TCP
  portName: https
  appProtocol: HTTPS
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: http
    service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "443"
  loadBalancer: {}
  # Restrict who can reach OpenCTI:
  #   sourceRanges: ["203.0.113.4/32"]

resources:
  requests:
    memory: 1Gi
    cpu: 500m
  limits:
    memory: 4Gi
    cpu: "2"

worker:
  enabled: true
  replicaCount: 1

  image:
    pullPolicy: IfNotPresent

  readyChecker:
    enabled: true
    retries: 60
    timeout: 5

  lifecycle:
    preStop:
      exec:
        command: ["sh", "-c", "sleep 5"]

  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 1Gi

  strategy:
    type: Recreate

  terminationGracePeriodSeconds: 20

connectors: []

opensearch:
  enabled: true
  fullnameOverride: opencti-opensearch

  nodeGroup: ""
  singleNode: true
  opensearchJavaOpts: "-Xms1g -Xmx1g"

  sysctlInit:
    enabled: true

  config:
    opensearch.yml: |
      plugins.security.disabled: true

  resources:
    requests:
      memory: 1536Mi
      cpu: 500m
    limits:
      memory: 2Gi
      cpu: "1"

  persistence:
    enabled: true
    size: 20Gi

rustfs:
  fullnameOverride: opencti-rustfs

  mode:
    standalone:
      enabled: true
    distributed:
      enabled: false

  ingress:
    enabled: false

  secret:
    existingSecret: opencti-credentials

  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi

rabbitmq:
  fullnameOverride: opencti-rabbitmq

  auth:
    username: user
    existingPasswordSecret: opencti-credentials
    existingErlangSecret: opencti-credentials

  clustering:
    enabled: false

  networkPolicy:
    enabled: false

  persistence:
    enabled: false

  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi

redis:
  fullnameOverride: opencti-redis

  resources:
    requests:
      memory: 256Mi
      cpu: 50m
    limits:
      memory: 512Mi

  extraArgs:
    - --maxmemory=256mb
    - --proactor_threads=1
    - --num_shards=1
